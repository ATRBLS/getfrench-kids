    @keyframes splash-pulse {
      0%,100% { opacity:1; transform:scale(1) rotate(-2deg); }
      50% { opacity:0.9; transform:scale(1.06) rotate(2deg); }
    }
    #splash svg { animation: splash-pulse 1.8s ease-in-out infinite; }
